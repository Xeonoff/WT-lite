# Blueprint для Render.com: New → Blueprint → выбрать репозиторий
services:
  - type: web
    name: wt-lite
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
